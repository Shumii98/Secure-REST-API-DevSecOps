name: Security CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security:
    runs-on: ubuntu-latest

    env:
      API_TOKEN: dev-secret-token
      JWT_SECRET_KEY: test-secret-key-for-ci-only
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install ruff bandit pytest-cov

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: SAST with Bandit
        run: |
          bandit -r src -ll

      - name: Run security tests with coverage
        run: |
          python -m pytest -v --cov=src --cov-report=term-missing --cov-fail-under=85

      - name: Run dependency audit
        run: |
          python -m pip_audit

      - name: Secret scanning with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}